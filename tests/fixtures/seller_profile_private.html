                            aria-haspopup="dialog"

                            id="j-profile-info-button"
                            class="userprofile--info icon-button">

<h2 class="userprofile--name">

    <link rel="stylesheet" type="text/css" href="https://www.kleinanzeigen.de/bffstatic/user-reputation/user-reputation-bundle.css"/>
    <script type="text/javascript" src="https://www.kleinanzeigen.de/bffstatic/user-reputation/user-reputation-bundle.js"></script>

    <script type="text/javascript">
        async function getUserReputationSummaryFromHost() {
            try {
                const userReputationApiUrl = "https://gateway.kleinanzeigen.de/user-reputation-service/public/users/{userId}/reputation-summary";
                const userId = "1";
                const response = await fetch(
                    userReputationApiUrl.replace("{userId}", encodeURIComponent(userId))
                );

                if (!response.ok) {
                    return null;
                }

                return response.json();
            } catch (e) {
                return null;
            }
        }

        getUserReputationSummaryFromHost().then(function(userReputationData) {
            if (window.userReputation && window.userReputation.render) {
                window.userReputation.render({
                    containerId: "user-reputation",
                    userReputationData: userReputationData
                });
            }
        });
    </script>
<div class="profile-userbadges">
