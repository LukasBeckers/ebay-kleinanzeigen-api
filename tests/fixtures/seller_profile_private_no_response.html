<!DOCTYPE html><html lang="de"><head><title>Alle Anzeigen von Bernd | Kleinanzeigen</title></head><body>
<section data-followed-user="15626332" class="l-container-row contentbox surface userprofile j-followeduser">
                    <header class="a-single-margin l-container-row">
                        <button
                            aria-haspopup="dialog"
                            aria-label="Profilinformationen öffnen"
                            id="j-profile-info-button"
                            class="userprofile--info icon-button">
                            <i class="icon icon-info-green-big"></i>
                        </button>
                        <span class="user-profile-badge">B</span>
                                <div id="super-user-clickable-badge" class="userprofile--superuser-badge">
    </div>
<h2 class="userprofile--name">
                                    <span class="sr-only">Profil von</span>
                                    Bernd</h2>
                            <div id="user-reputation" class="userprofile--reputation">
    </div>

    <link rel="stylesheet" type="text/css" href="https://www.kleinanzeigen.de/bffstatic/user-reputation/user-reputation-bundle.css"/>
    <script type="text/javascript" src="https://www.kleinanzeigen.de/bffstatic/user-reputation/user-reputation-bundle.js"></script>

    <script type="text/javascript">
        async function getUserReputationSummaryFromHost() {
            try {
                const userReputationApiUrl = "https://gateway.kleinanzeigen.de/user-reputation-service/public/users/{userId}/reputation-summary";
                const userId = "15626332";
                const response = await fetch(
                    userReputationApiUrl.replace("{userId}", encodeURIComponent(userId))
                );

                if (!response.ok) {
                    return null;
                }

                return response.json();
            } catch (e) {
                return null;
            }
        }

        getUserReputationSummaryFromHost().then(function(userReputationData) {
            if (window.userReputation && window.userReputation.render) {
                window.userReputation.render({
                    containerId: "user-reputation",
                    userReputationData: userReputationData
                });
            }
        });
    </script>
<div class="profile-userbadges">
                            </div>
                        <div class="userprofile-info">
                            <div class="userprofile-details">
                                <i class="icon icon-small icon-meins-small"></i>
                                <span class="userprofile-details-text">
                                Privater Nutzer</span>
                            </div>
                            <div class="userprofile-details">
                                <i class="icon icon-small icon-bookmark-small"></i>
                                <span class="userprofile-details-text">Aktiv seit 19.06.2013</span>
                            </div>
                            <div class="userprofile-details">
                                    <i class="icon icon-small icon-followers"></i>
                                    <span class="userprofile-details-text">1 Follower</span>
                                </div>
                            </div>

                        <div class="follow-user">

                href="/m-einloggen.html?targetUrl=%2Fs-bestandsliste.html%3FuserId%3D15626332%26ff%3Dtrue%26csrf%3D82cb19f2-574c-463f-ba3d-78e38b93a776"
        data-gaevent="ResultsSeller,FollowUserBegin" data-gaevent-direct="true" id="follow-user-button"
                class="button button-toggle follow-user-button"   title="Folgen" >

            <i class="button-icon button-icon icon-follow-user-green"></i>
            <span>Folgen</span>
            </a>
    </div>

                </section>
</body></html>
